# Hạ tầng chạy local cho ShopMart.
#   docker compose up -d
#
# MySQL đã được cấu hình sẵn (mỗi service tự tạo database riêng - Database per Service):
#   shopmart_order | shopmart_inventory | shopmart_payment
# Nếu máy đã có MySQL chạy ở cổng 3306 thì có thể bỏ service mysql bên dưới
# và sửa username/password trong cấu hình của từng service.

services:
  mysql:
    image: mysql:8.0
    container_name: shopmart-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  kafka:
    image: bitnami/kafka:3.7
    container_name: shopmart-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/bitnami/kafka

  redis:
    image: redis:7-alpine
    container_name: shopmart-redis
    ports:
      - "6379:6379"

volumes:
  mysql_data:
  kafka_data:
